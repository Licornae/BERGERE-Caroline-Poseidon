<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>Home</title>
<link rel="stylesheet" href="../../css/bootstrap.min.css" >
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
	<div class="row">
		<div class="col-6">
			<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
			<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
			<a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
			<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
			<a href="/ruleName/list">Rule</a>
			<span th:if="${isAdmin}">&nbsp;|&nbsp;<a href="/user/list">Users</a></span>
		</div>
		<div class="col-6 text-right">
			Logged in user: <b th:inline="text"  class="user"> [[${currentUsername}]]  </b>
			<form th:action="@{/app/logout}" method="POST">
				<input type="submit" value="Logout"/>
			</form>
		</div>
	</div>
	<div class="row"><h2>Curve Point List</h2></div>
	<div class="row">
		<a href="/curvePoint/add" class="btn btn-primary btn-sm">Add New</a>
		<div class="table-responsive">
		<table class="table table-bordered table-sm">
			<thead>
				<tr>
					<th>Id</th>
					<th>Curve Id</th>
					<th>As Of Date</th>
					<th>Term</th>
					<th>Value</th>
					<th>Creation Date</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="curvePoint : ${curvePoints}">
					<td th:text="${curvePoint.id}"></td>
					<td th:text="${curvePoint.curveId}"></td>
					<td th:text="${curvePoint.asOfDate}"></td>
					<td th:text="${curvePoint.term}"></td>
					<td th:text="${curvePoint.value}"></td>
					<td th:text="${curvePoint.creationDate != null ? #dates.format(curvePoint.creationDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
					<td style="width: 15%" class="text-center">
						<a th:href="@{/curvePoint/update/{id}(id=${curvePoint.id})}">Edit</a>&nbsp;|&nbsp;
						<form th:action="@{/curvePoint/delete/{id}(id=${curvePoint.id})}" method="post" style="display:inline;">
							<button type="submit" class="btn btn-link p-0 align-baseline">Delete</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		</div>
	</div>
</div>
</body>
</html>
