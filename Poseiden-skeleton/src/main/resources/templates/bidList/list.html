<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>Home</title>
<link rel="stylesheet" href="../../css/bootstrap.min.css" >
</head>
<body>
<div class="container">
	<div class="row">
		<div class="col-6">
			<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
			<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
			<a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
			<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
			<a href="/ruleName/list">Rule</a>
			<span th:if="${isAdmin}">&nbsp;|&nbsp;<a href="/user/list">Users</a></span>
		</div>
		<div class="col-6 text-right">
			Logged in user: <b th:inline="text"  class="user"> [[${currentUsername}]] </b>
			<form th:action="@{/app/logout}" method="POST">
				<input type="submit" value="Logout"/>
			</form>
		</div>
	</div>
	<div class="row"><h2>Bid List</h2></div>
	<div class="row">
		<a href="/bidList/add" class="btn btn-primary btn-sm">Add New</a>
		<div class="table-responsive">
		<table class="table table-bordered table-sm">
			<thead>
				<tr>
					<th>Id</th>
					<th>Account</th>
					<th>Type</th>
					<th>Bid Quantity</th>
					<th>Ask Quantity</th>
					<th>Bid</th>
					<th>Ask</th>
					<th>Benchmark</th>
					<th>Status</th>
					<th>Trader</th>
					<th>Bid List Date</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="bidList : ${bidLists}">
					<td th:text="${bidList.bidListId}"></td>
					<td th:text="${bidList.account}"></td>
					<td th:text="${bidList.type}"></td>
					<td th:text="${bidList.bidQuantity}"></td>
					<td th:text="${bidList.askQuantity}"></td>
					<td th:text="${bidList.bid}"></td>
					<td th:text="${bidList.ask}"></td>
					<td th:text="${bidList.benchmark}"></td>
					<td th:text="${bidList.status}"></td>
					<td th:text="${bidList.trader}"></td>
					<td th:text="${bidList.bidListDate != null ? #dates.format(bidList.bidListDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
					<td style="white-space: nowrap;" class="text-center">
						<a th:href="@{/bidList/update/{id}(id=${bidList.bidListId})}">Edit</a>&nbsp;|&nbsp;
						<form th:action="@{/bidList/delete/{id}(id=${bidList.bidListId})}" method="post" style="display:inline;">
							<button type="submit" class="btn btn-link p-0 align-baseline">Delete</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		</div>
	</div>
</div>
</body>
</html>
